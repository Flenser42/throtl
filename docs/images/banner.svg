<?xml version="1.0" encoding="UTF-8"?>
<svg width="1280" height="400" viewBox="0 0 1280 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1116"/>
      <stop offset="0.55" stop-color="#141a21"/>
      <stop offset="1" stop-color="#1c242e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4fd07f" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#4fd07f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f8fc"/>
      <stop offset="1" stop-color="#b9c4cf"/>
    </linearGradient>
    <linearGradient id="meter" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4fd07f"/>
      <stop offset="0.55" stop-color="#e6d24a"/>
      <stop offset="1" stop-color="#f5a45a"/>
    </linearGradient>
    <linearGradient id="needle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#aeb8c2"/>
      <stop offset="1" stop-color="#f2f6fa"/>
    </linearGradient>
    <linearGradient id="iconbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#242b34"/>
      <stop offset="1" stop-color="#0c1014"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>
  <circle cx="225" cy="200" r="190" fill="url(#glow)"/>

  <!-- App icon -->
  <g transform="translate(120,95) scale(1.64)">
    <rect x="4" y="4" width="120" height="120" rx="28"
          fill="url(#iconbg)" stroke="#333c46" stroke-width="2"/>
    <path d="M 38.5 91.5 A 36 36 0 1 1 89.5 91.5"
          fill="none" stroke="#2b323b" stroke-width="11" stroke-linecap="round"/>
    <path d="M 38.5 91.5 A 36 36 0 1 1 89.5 91.5"
          fill="none" stroke="url(#meter)" stroke-width="11" stroke-linecap="round"
          stroke-dasharray="150 999"/>
    <g stroke="#5c646d" stroke-width="3" stroke-linecap="round">
      <line x1="64" y1="22" x2="64" y2="31"/>
      <line x1="46.5" y1="28.7" x2="51.2" y2="36.0"/>
      <line x1="81.5" y1="28.7" x2="76.8" y2="36.0"/>
    </g>
    <line x1="64" y1="66" x2="85.5" y2="44.5"
          stroke="url(#needle)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="64" cy="66" r="8" fill="#e6edf3"/>
    <circle cx="64" cy="66" r="3.4" fill="#4fd07f"/>
    <path d="M 47 104 l 5 5 5 -5" fill="none" stroke="#4fd07f"
          stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 71 109 l 5 -5 5 5" fill="none" stroke="#f5a45a"
          stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark + tagline -->
  <g font-family="Noto Sans, DejaVu Sans, Liberation Sans, sans-serif">
    <text x="360" y="188" font-size="108" font-weight="700"
          letter-spacing="-1" fill="url(#title)">Throtl</text>
    <text x="366" y="238" font-size="26" fill="#9aa6b2">
      Per-application bandwidth limits &amp; traffic prioritisation
    </text>
    <text x="366" y="272" font-size="26" fill="#9aa6b2">
      for Linux — GTK4 + libadwaita
    </text>
  </g>
  <rect x="366" y="292" width="150" height="6" rx="3" fill="url(#meter)"/>

  <!-- Pills -->
  <g font-family="Noto Sans, DejaVu Sans, Liberation Sans, sans-serif"
     font-size="19" fill="#8b98a5">
    <g>
      <rect x="366" y="322" width="106" height="40" rx="20"
            fill="#1b2027" stroke="#2b323b"/>
      <text x="419" y="348" text-anchor="middle">TrafficToll</text>
    </g>
    <g>
      <rect x="486" y="322" width="100" height="40" rx="20"
            fill="#1b2027" stroke="#2b323b"/>
      <text x="536" y="348" text-anchor="middle">nethogs</text>
    </g>
    <g>
      <rect x="600" y="322" width="96" height="40" rx="20"
            fill="#1b2027" stroke="#2b323b"/>
      <text x="648" y="348" text-anchor="middle">GTK4</text>
    </g>
    <g>
      <rect x="710" y="322" width="150" height="40" rx="20"
            fill="#1b2027" stroke="#2b323b"/>
      <text x="785" y="348" text-anchor="middle">GPL-3.0</text>
    </g>
  </g>
</svg>

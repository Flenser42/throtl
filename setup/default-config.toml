# Default configuration for the Throtl daemon (root, /etc/throtl).
# Normally it is managed via the GUI/CLI and persisted here.
version = 1
# "interface" may be "auto"; the daemon then detects the default-routing
# interface automatically.
interface = "auto"
unit = "kbps"

[global]
enabled = true

# Global interface limits (kbit/s). An UNSET key = unlimited.
# Important: a value of 0 is interpreted as a real limit of 0 kbit/s (blocks
# everything); for "no limit" omit the key or set it to "None".
# download_limit = 0
# upload_limit = 0

# Guaranteed minimum rates for unmatched traffic (kbit/s)
download_minimum = 100
upload_minimum = 10

# Global priority for everything that has no rule of its own
download_priority = "normal"
upload_priority = "normal"


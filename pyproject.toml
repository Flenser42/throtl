[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "throtl"
dynamic = ["version"]
description = "NetLimiter-style per-application bandwidth limits and traffic prioritisation for Linux"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Flenser42", email = "flenser42@gmx.de" }]
keywords = [
    "bandwidth",
    "qos",
    "traffic-shaping",
    "netlimiter",
    "tc",
    "gtk4",
    "libadwaita",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: System :: Systems Administration",
]
# Intentionally no pip dependencies: the backend uses only the standard library.
# PyGObject (Gtk4/Adw), nethogs and TrafficToll are installed system-side by
# setup/install.sh (or your distro's package manager).
dependencies = []

[project.optional-dependencies]
# The GUI needs the system PyGObject; the "gui" extra exists for clarity only.
gui = []
dev = ["ruff>=0.6", "build>=1.2"]

[project.urls]
Homepage = "https://github.com/Flenser42/throtl"
Repository = "https://github.com/Flenser42/throtl"
Issues = "https://github.com/Flenser42/throtl/issues"
Changelog = "https://github.com/Flenser42/throtl/blob/master/CHANGELOG.md"

[project.scripts]
throtl-cli = "throtl.cli:main"
throtl-daemon = "throtl.daemon:main"
throtl-gui = "throtl.gui.app:main"

[tool.setuptools]
packages = ["throtl", "throtl.gui"]
include-package-data = true

[tool.setuptools.package-data]
"throtl.gui" = ["*.css"]

[tool.setuptools.dynamic]
version = { attr = "throtl.__version__" }

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["attic"]

[tool.ruff.lint]
# Pragmatic, low-noise rule set. The project deliberately catches broad
# exceptions in the daemon/GUI (a bad callback or a dead monitor must never
# take the process down), so BLE/S rules are intentionally not enabled.
select = ["E4", "E7", "E9", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# In GTK modules `gi.require_version()` must run before importing
# `gi.repository`, so the import block legitimately lives below a statement.
"throtl/gui/*.py" = ["E402"]

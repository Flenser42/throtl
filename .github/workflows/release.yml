name: Release

on:
  push:
    tags: ["v*"]

# Release assets are attached with the job-scoped GITHUB_TOKEN, so each job
# declares only the write access it needs (zizmor: excessive-permissions).
permissions: {}

jobs:
  build:
    name: Build and attach artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Ensure release exists and attach artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" \
                 --title "Throtl $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber

  deb:
    name: Build and attach .deb
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Build .deb
        run: |
          python -m pip install --upgrade pip
          bash packaging/deb/build.sh
      - name: Attach .deb to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" dist/*.deb --clobber

  dashboard:
    name: Build and attach the dashboard (.deb + .rpm)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          # Caching is on by default since setup-node v4; disable it here. This
          # workflow publishes runtime artifacts, and a poisoned cache entry
          # restored on a tag build could reach a release (zizmor:
          # cache-poisoning). CI caches the dashboard build instead.
          package-manager-cache: false
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d  # stable
        with:
          toolchain: stable
      - name: Build the frontend
        working-directory: throtl-app
        run: npm ci --no-audit --no-fund && npm run build
      - name: Build the deb + rpm bundles
        working-directory: throtl-app
        run: npm run tauri build -- --bundles deb,rpm
      - name: Attach the dashboard packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            throtl-app/src-tauri/target/release/bundle/deb/*.deb \
            throtl-app/src-tauri/target/release/bundle/rpm/*.rpm --clobber

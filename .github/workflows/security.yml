name: Security

# Runs on pull requests and on a weekly schedule (not on every push to master,
# so the fast CI stays fast). Actions are pinned to full commit SHAs — the
# repository also enforces sha_pinning_required.
on:
  pull_request:
  schedule:
    - cron: "23 6 * * 1"  # Mondays 06:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
        with:
          fail-on-severity: high

  python-audit:
    name: Python dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: pip-audit
        run: |
          python -m pip install --upgrade pip pip-audit
          # The backend is standard-library only; audit what we ship and use.
          python -m pip install "ruff>=0.6" "build>=1.2" traffictoll
          pip-audit

  dashboard-audit:
    name: Dashboard dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: throtl-app/package-lock.json
      - name: npm audit
        working-directory: throtl-app
        run: npm audit --audit-level=high --package-lock-only

  workflow-lint:
    name: Workflow security lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: zizmor
        run: |
          python -m pip install --upgrade pip pipx
          pipx run zizmor --format plain .github/workflows

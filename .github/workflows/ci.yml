name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint & tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tooling
        run: python -m pip install --upgrade pip ruff build
      - name: Lint (ruff)
        run: ruff check .
      - name: Byte-compile
        run: python -m compileall -q throtl tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Design-token contrast (WCAG AA)
        run: python tools/check_contrast.py
      - name: Build sdist + wheel
        run: python -m build

  frontend:
    name: Dashboard frontend (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: throtl-app/package-lock.json
      - name: Install
        working-directory: throtl-app
        run: npm ci --no-audit --no-fund
      - name: Typecheck + build
        working-directory: throtl-app
        run: npm run build

  rust-shell:
    name: Rust shell (Tauri bridge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: throtl-app/package-lock.json
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d  # stable
        with:
          toolchain: stable
          components: clippy
      - name: Build frontend (tauri-build reads ../dist)
        working-directory: throtl-app
        run: npm ci --no-audit --no-fund && npm run build
      - name: Clippy (deny warnings)
        run: cargo clippy --manifest-path throtl-app/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --manifest-path throtl-app/src-tauri/Cargo.toml

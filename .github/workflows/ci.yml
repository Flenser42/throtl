name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint & tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tooling
        run: python -m pip install --upgrade pip ruff build
      - name: Lint (ruff)
        run: ruff check .
      - name: Byte-compile
        run: python -m compileall -q throtl tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Build sdist + wheel
        run: python -m build

  gui-tests:
    name: GUI tests (GTK4, Xvfb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # GTK4/Adw are used through the *system* PyGObject, so this job uses the
      # distro Python rather than actions/setup-python.
      - name: Install GTK4 + Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 xvfb
      - name: GUI widget/table tests
        run: xvfb-run -a /usr/bin/python3 -m unittest tests.test_gui -v

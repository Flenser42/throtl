version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
        # Majors stay out of the group so each one gets its own PR to review.
        update-types: ["minor", "patch"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Dashboard frontend (React/Vite/Tailwind) — was not watched before.
  - package-ecosystem: npm
    directory: /throtl-app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dashboard:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Rust shell (Tauri + plugins).
  - package-ecosystem: cargo
    directory: /throtl-app/src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      rust:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # RUSTSEC-2024-0429 ("unsound", informational): the VariantStrIter bug is
      # fixed in glib 0.20, which needs gtk-rs 0.20 — Tauri 2.x still pins
      # gtk 0.18, so the bump is not resolvable from this repository. Allow
      # 0.20+ so the update lands as soon as Tauri moves.
      - dependency-name: glib
        versions: ["<0.20.0"]
